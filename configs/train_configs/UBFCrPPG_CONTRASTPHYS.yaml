BASE: ['']
TOOLBOX_MODE: "train_and_test"
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 30
  LR: 1e-5
  MODEL_FILE_NAME: UBFC-rPPG_ContrastPhys
  PLOT_LOSSES_AND_LR: True
  DATA:
    FS: 30  # UBFC-rPPG is 30 fps
    DATASET: UBFC-rPPG
    DO_PREPROCESS: False # Set to True if running preprocessing for the first time
    DATA_FORMAT: NCDHW
    DATA_PATH: "/Users/drozanes/Downloads/UBFC-rPPG_Raw/DATASET_2" # Update this to your raw data path
    CACHED_PATH: "PreprocessedData"
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 0.8
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized']
      DATA_AUG: ['None']
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 128
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 128
        W: 128
