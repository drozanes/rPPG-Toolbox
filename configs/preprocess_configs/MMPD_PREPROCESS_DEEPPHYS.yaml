BASE: ['']
TOOLBOX_MODE: "only_preprocess"
TRAIN:
  BATCH_SIZE: 4
  DATA:
    FS: 30
    DATASET: MMPD
    DO_PREPROCESS: True
    DATA_FORMAT: NDCHW
    DATA_PATH: "./MMPD_dataset"
    CACHED_PATH: "PreprocessedData"
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 0.061
    INFO:
      LIGHT: [1, 2, 3, 4]
      MOTION: [1, 2, 3, 4]
      EXERCISE: [1, 2]
      SKIN_COLOR: [1, 2, 3, 4, 5, 6]
      GENDER: [1, 2]
      GLASSER: [1, 2]
      HAIR_COVER: [1, 2]
      MAKEUP: [1, 2]
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized', 'Raw']
      DATA_AUG: ['None']
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 180
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 72
        W: 72
